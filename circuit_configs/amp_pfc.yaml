# 训练设备
train_device: "cpu"

# 仿真目录
base_dir: ../simulation_files/amp_pfc
file_paths:
  ACDC_cir_path: "AMP_PFC_ACDC.cir"
  Tran_cir_path: "AMP_PFC_Tran.cir"
  netlist_path: "AMP_PFC_Pin_3_HSPICE_130.txt"
  vars_path: "AMP_PFC_vars.spice"
  dev_params_path: "AMP_PFC_dev_params.spice"
  op_mean_std_path: "AMP_PFC_op_mean_std.json"
  
  dc_results_path: "AMP_PFC_ACDC_DC"
  ac_results_path: "AMP_PFC_ACDC_AC"
  op_results_path: "AMP_PFC_op"
  GBW_PM_path: "AMP_PFC_ACDC_GBW_PM"  
  tran_results_path: "AMP_PFC_Tran"
  tran_dat_path: "AMP_PFC_tran.dat"

# 器件
device:
  M0: {range: {W: [0.5, 10], L: [0.5, 5], M: [1, 50]}, step: {W: 0.1, L: 0.1, M: 1}, init: {W: 1, L: 1, M: 4}, num: 8}
  M8: {range: {W: [0.5, 10], L: [0.5, 5], M: [1, 50]}, step: {W: 0.1, L: 0.1, M: 1}, init: {W: 1, L: 1, M: 4}, num: 2}
  M10: {range: {W: [0.5, 10], L: [0.5, 5], M: [1, 50]}, step: {W: 0.1, L: 0.1, M: 1}, init: {W: 1, L: 1, M: 4}, num: 1}
  M11: {range: {W: [0.5, 10], L: [0.5, 5], M: [100, 500]}, step: {W: 0.1, L: 0.1, M: 1}, init: {W: 1, L: 1, M: 16}, num: 1}
  M17: {range: {W: [0.5, 10], L: [0.5, 5], M: [1, 50]}, step: {W: 0.1, L: 0.1, M: 1}, init: {W: 1, L: 1, M: 4}, num: 9}
  M21: {range: {W: [0.5, 10], L: [0.5, 5], M: [1, 50]}, step: {W: 0.1, L: 0.1, M: 1}, init: {W: 1, L: 1, M: 4}, num: 2}
  M23: {range: {W: [0.5, 10], L: [0.5, 5], M: [1, 50]}, step: {W: 0.1, L: 0.1, M: 1}, init: {W: 1, L: 1, M: 8}, num: 1}
  Ib: {range: {I: [1e-6, 30e-6]}, init: {I: 4e-6}, num: 1}
  C0: {range: {M: [1, 30]}, step: {M: 1}, init: {M: 10}, num: 1}
  C1: {range: {M: [1, 30]}, step: {M: 1}, init: {M: 10}, num: 1}
#动作维度
action_dim: 24

# 性能
performance:
  phase_margin: {target: 60} #unit:deg
  dcgain: {target: 130, objective: max, baseline: 90} #unit:dB
  PSRP: {target: -100, objective: min, baseline: -60} #unit:dB
  PSRN: {target: -100, objective: min, baseline: -60} #unit:dB
  PSRR: {target: -100, objective: min, baseline: -60} #unit:dB
  cmrrdc: {target: -100, objective: min, baseline: -60} #unit:dB
  vos: {target: 0.06e-3, objective: min, baseline: 0.1e-3} #unit:V
  TC: {target: 10e-6, objective: min, baseline: 50e-6} #unit:
  settlingTime: {target: 1e-6, objective: min, baseline: 5e-6} #unit:s
  FOML: {target: 190, objective: max, baseline: 50} #V/us*pF/mW
  FOMS: {target: 700, objective: max, baseline: 100} #MHz*pF/mW
  Active_Area: {target: 140, objective: min, baseline: 300} #unit:mm^2
  Power: {target: 0.3, objective: min, baseline: 0.5} #unit:mW
  GBW: {target: 1e6, objective: max, baseline: 0.4e6} #unit:Hz
  sr: {target: 0.4, objective: max, baseline: 0.2} #unit:V/us

# 负载电容
PARAM_CLOAD: 130  

